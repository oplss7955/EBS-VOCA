<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>EBS VOCA 1800 학습 앱 (Day 37~60)</title>
    <style>
        :root {
            --primary: #b08d45;
            --primary-hover: #8f6f2d;
            --bg-color: #fbf9f4;
            --card-bg: #ffffff;
            --text-main: #29251d;
            --text-sub: #6f6655;
            --gold-light: #f4ead2;
            --gold-border: #d8c18a;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary);
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #e5e7eb;
            color: var(--text-sub);
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        .set-selector {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-sub);
            background: #f9fafb;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            background: #fafafa;
            position: relative;
        }
        .day-badge {
            position: absolute;
            top: 10px;
            left: 15px;
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .word-en {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .word-ko {
            font-size: 1.25rem;
            color: var(--text-sub);
            cursor: pointer;
            padding: 10px;
            background: #e5e7eb;
            border-radius: 6px;
            width: 80%;
            transition: background 0.2s;
        }
        .word-ko.hidden {
            background: #d1d5db;
            color: transparent;
            user-select: none;
        }
        .word-ko.hidden:hover {
            background: #9ca3af;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        button.action-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        button.action-btn:hover {
            background: var(--primary-hover);
        }
        button.secondary-btn {
            background: #6b7280;
        }
        button.secondary-btn:hover {
            background: #4b5563;
        }
        .quiz-input-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 1.5rem;
        }
        .correct { color: #10b981; }
        .incorrect { color: #ef4444; }
        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .sub-tab-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--primary);
            background: white;
            color: var(--primary);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .sub-tab-btn.active {
            background: var(--primary);
            color: white;
        }

        /* 화이트 골드 테마 */
        body { background: linear-gradient(135deg, #fffdf8, #f5f0e5); }
        .container {
            border: 1px solid var(--gold-border);
            box-shadow: 0 8px 24px rgba(143, 111, 45, 0.10);
        }
        h1 { color: #9b7835; }
        .tab-btn { background: #f2eee5; }
        .tab-btn.active, button.action-btn {
            background: linear-gradient(135deg, #c8a85d, #a78335);
            color: #fff;
        }
        button.action-btn:hover { background: #8f6f2d; }
        .day-badge { background: #b08d45; }
        .card { border-color: #e7dcc0; background: #fffefa; }
        .word-ko { background: #f1e8d4; color: #55462a; }
        .word-ko.hidden { background: #e8e1d2; color: transparent; }
        .word-ko.hidden:hover { background: #d9ccb0; }
        .stats-bar { background: #faf6ec; }
        .sub-tab-btn { border-color: var(--gold-border); color: #8f6f2d; }
        input[type="text"], select { border-color: #d8c9a7; }
        input[type="text"]:focus, select:focus {
            outline: 2px solid #e3d1a3;
            outline-offset: 1px;
        }

            body { padding: 12px; }
            .container { padding: 16px; }
            .card { padding: 24px 16px; }
            .word-en { font-size: 1.7rem; overflow-wrap: anywhere; }
            .quiz-input-container { flex-direction: column; }
            .quiz-input-container button { width: 100%; }
            .stats-bar { gap: 8px; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>EBS VOCA 1800 학습기</h1>
    
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchMode('study', this)">공부모드</button>
        <button class="tab-btn" onclick="switchMode('quiz', this)">퀴즈모드</button>
    </div>

    <div class="set-selector">
        <label for="setSelect" id="setLabel">학습 세트 선택 (3Day 묶음):</label>
        <select id="setSelect" onchange="changeSet()"></select>
    </div>

    <!-- 공부모드 영역 -->
    <div id="studyMode" class="mode-section">
        <div class="stats-bar">
            <span id="studyProgress">1 / 90</span>
            <button class="secondary-btn" style="padding: 2px 8px; font-size:0.8rem;" onclick="toggleHideAll()">현재 뜻 가리기/보이기</button>
        </div>
        <div class="card">
            <span class="day-badge" id="studyDayBadge">DAY 37</span>
            <div class="word-en" id="studyEn">Word</div>
            <div class="word-ko hidden" id="studyKo" onclick="revealMeaning()">뜻 (여기를 누르세요)</div>
        </div>
        <div class="controls">
            <button class="action-btn secondary-btn" onclick="prevCard()">이전</button>
            <button class="action-btn" onclick="nextCard()">다음</button>
        </div>
    </div>

    <!-- 퀴즈모드 영역 -->
    <div id="quizMode" class="mode-section" style="display: none;">
        <div class="sub-tabs">
            <button class="sub-tab-btn active" id="subQuizBtn" onclick="switchQuizSubMode('quiz')">일반 퀴즈</button>
            <button class="sub-tab-btn" id="subWrongBtn" onclick="switchQuizSubMode('wrong')">오답노트 퀴즈 (<span id="wrongCountBadge">0</span>)</button>
        </div>
        
        <div class="stats-bar">
            <span id="quizProgress">문제: 0 / 90</span>
            <span id="quizScore">맞은 개수: 0 | 틀린 개수: 0</span>
        </div>

        <div class="card">
            <span class="day-badge" id="quizDayBadge">DAY --</span>
            <div class="word-en" id="quizEn">Ready?</div>
            <div style="font-size: 0.85rem; color: #6b7280; margin-top: 5px;">뜻을 입력하고 엔터를 누르세요 (쉼표로 구분된 뜻 중 하나 이상 일치 시 정답)</div>
            <div class="quiz-input-container">
                <input type="text" id="quizInput" placeholder="한국어 뜻 입력..." onkeypress="handleQuizInput(event)">
                <button class="action-btn" onclick="submitAnswer()">제출</button>
            </div>
            <div class="feedback" id="quizFeedback"></div>
        </div>
        <div class="controls">
            <button class="action-btn secondary-btn" onclick="initQuiz()">퀴즈 리셋 / 재시작</button>
            <button class="action-btn secondary-btn" onclick="clearWrongList()">오답노트 초기화</button>
        </div>
    </div>
</div>

    // 3Day 묶음 세트 생성 (Day 37~39부터 Day 58~60까지)
    let sets = [];
    for (let d = 37; d <= 60; d += 3) {
        sets.push({
            title: `Day ${d} ~ Day ${d+2}`,
            days: [d, d+1, d+2]
        });
    }

    let currentSetIndex = 0;
    let currentMode = 'study';
    let currentSubMode = 'quiz'; // 'quiz' or 'wrong'

    // 공부모드 상태
    let studyWords = [];
    let studyIndex = 0;

    // 퀴즈모드 상태
    let quizWords = [];
    let quizIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let wrongList = [];
    let answerPending = false;


    // Verify every three-day set contains 90 source words.
    function validateVocabularyData() {
        for (let start = 37; start <= 60; start += 3) {
            const count = [start, start + 1, start + 2].reduce((sum, day) => sum + ((vocabData[day] || []).length), 0);
            if (count !== 90) console.error(`Day ${start}-${start + 2} must contain 90 words; found ${count}.`);
        }
    }

    window.onload = function() {
        validateVocabularyData();
        initSetSelector();
        changeSet();
    };

    function initSetSelector() {
        const select = document.getElementById('setSelect');
        select.innerHTML = '';
        sets.forEach((s, idx) => {
            let opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = s.title;
            select.appendChild(opt);
        });
    }

    function changeSet() {
        currentSetIndex = Number(document.getElementById('setSelect').value);
        loadStudyData();
        initQuiz();
    }

    function switchMode(mode, button) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if (button) button.classList.add('active');
        if (mode === 'study') {
            document.getElementById('studyMode').style.display = 'block';
            document.getElementById('quizMode').style.display = 'none';
            loadStudyData();
        } else {
            document.getElementById('studyMode').style.display = 'none';
            document.getElementById('quizMode').style.display = 'block';
            initQuiz();
        }
    }

    // --- 공부모드 로직 ---
    function loadStudyData() {
        const targetDays = sets[currentSetIndex].days;
        studyWords = [];
        targetDays.forEach(day => {
            if (vocabData[day]) {
                vocabData[day].forEach(item => {
                    studyWords.push({ ...item, day: day });
                });
            }
        });
        studyIndex = 0;
        renderStudyCard();
    }

    function renderStudyCard() {
        if (studyWords.length === 0) return;
        const current = studyWords[studyIndex];
        document.getElementById('studyDayBadge').innerText = `DAY ${current.day}`;
        document.getElementById('studyEn').innerText = current.en;
        const koElem = document.getElementById('studyKo');
        koElem.innerText = current.ko;
        koElem.classList.add('hidden');
        document.getElementById('studyProgress').innerText = `${studyIndex + 1} / ${studyWords.length}`;
    }

    function revealMeaning() {
        document.getElementById('studyKo').classList.remove('hidden');
    }

    function toggleHideAll() {
        document.getElementById('studyKo').classList.toggle('hidden');
    }

    function nextCard() {
        if (studyIndex < studyWords.length - 1) {
            studyIndex++;
            renderStudyCard();
        } else {
            alert('세트의 마지막 단어입니다.');
        }
    }

    function prevCard() {
        if (studyIndex > 0) {
            studyIndex--;
            renderStudyCard();
        } else {
            alert('첫 번째 단어입니다.');
        }
    }

    // --- 퀴즈모드 로직 ---
    function switchQuizSubMode(sub) {
        currentSubMode = sub;
        document.getElementById('subQuizBtn').classList.toggle('active', sub === 'quiz');
        document.getElementById('subWrongBtn').classList.toggle('active', sub === 'wrong');
        initQuiz();
    }

    function initQuiz() {
        answerPending = false;
        correctCount = 0;
        wrongCount = 0;
        quizIndex = 0;
        
        if (currentSubMode === 'quiz') {
            const targetDays = sets[currentSetIndex].days;
            quizWords = [];
            targetDays.forEach(day => {
                if (vocabData[day]) {
                    // 퀴즈모드에서는 day 안에서 순서 섞기 허용
                    let shuffledDayWords = [...vocabData[day]].sort(() => Math.random() - 0.5);
                    shuffledDayWords.forEach(item => {
                        quizWords.push({ ...item, day: day });
                    });
                }
            });
        } else {
            // 오답노트 퀴즈 (틀린 단어들로 구성된 랜덤 퀴즈)
            quizWords = [...wrongList].sort(() => Math.random() - 0.5);
        }
        
        updateQuizStats();
        renderQuizCard();
    }

    function renderQuizCard() {
        const feedback = document.getElementById('quizFeedback');
        feedback.innerText = '';
        document.getElementById('quizInput').value = '';

        if (quizWords.length === 0 || quizIndex >= quizWords.length) {
            document.getElementById('quizDayBadge').innerText = '완료';
            document.getElementById('quizEn').innerText = '퀴즈 종료!';
            document.getElementById('quizInput').style.display = 'none';
            return;
        }

        document.getElementById('quizInput').style.display = 'block';
        const current = quizWords[quizIndex];
        document.getElementById('quizDayBadge').innerText = `DAY ${current.day || '오답노트'}`;
        document.getElementById('quizEn').innerText = current.en;
        document.getElementById('quizInput').focus();
    }

    function handleQuizInput(e) {
        if (e.key === 'Enter') {
            submitAnswer();
        }
    }

    function submitAnswer() {
        if (answerPending || quizWords.length === 0 || quizIndex >= quizWords.length) return;

        const userInput = document.getElementById('quizInput').value.trim();
        if (!userInput) return;

        answerPending = true;
        const current = quizWords[quizIndex];
        // 쉼표로 나뉜 뜻을 비교하되, 대괄호/소괄호 안의 표현은 있어도 되고 없어도 되도록 처리
        const normalizeAnswer = value => value.toLowerCase().replace(/[\s.,;:()\[\]{}·~]/g, '');
        function expandOptionalMeanings(value) {
            const match = value.match(/\[([^\]]*)\]|\(([^)]*)\)/);
            if (!match) return [value];
            const whole = match[0];
            const inner = match[1] !== undefined ? match[1] : match[2];
            const before = value.slice(0, match.index);
            const after = value.slice(match.index + whole.length);
            return [
                ...expandOptionalMeanings(before + inner + after),
                ...expandOptionalMeanings(before + after)
            ];
        }
        const validMeanings = current.ko.split(/[;,]/)
            .flatMap(expandOptionalMeanings).map(normalizeAnswer).filter(Boolean);
        const userMeanings = userInput.split(/[;,]/).map(normalizeAnswer).filter(Boolean);
        const isCorrect = userMeanings.some(answer => validMeanings.includes(answer));

        const feedback = document.getElementById('quizFeedback');
        if (isCorrect) {
            correctCount++;
            feedback.innerText = '정답입니다!';
            feedback.className = 'feedback correct';
        } else {
            wrongCount++;
            feedback.innerText = `오답! (정답: ${current.ko})`;
            feedback.className = 'feedback incorrect';
            // 오답노트에 추가 (중복 방지)
            if (!wrongList.some(w => w.en === current.en)) {
                wrongList.push(current);
            }
        }

        document.getElementById('wrongCountBadge').innerText = wrongList.length;
        updateQuizStats();

        quizIndex++;
        updateQuizStats();
        setTimeout(() => {
            renderQuizCard();
            answerPending = false;
        }, 1200);
    }

    function clearWrongList() {
        if (wrongList.length === 0) {
            alert('초기화할 오답이 없습니다.');
            return;
        }
        if (!confirm(`오답노트에 저장된 ${wrongList.length}개 단어를 모두 삭제할까요?`)) return;
        wrongList = [];
        document.getElementById('wrongCountBadge').innerText = '0';
        if (currentSubMode === 'wrong') {
            initQuiz();
        } else {
            updateQuizStats();
        }
        alert('오답노트를 초기화했습니다.');
    }

    function updateQuizStats() {
        document.getElementById('quizProgress').innerText = `문제: ${Math.min(quizIndex + (quizIndex < quizWords.length ? 1 : 0), quizWords.length)} / ${quizWords.length}`;
        document.getElementById('quizScore').innerText = `맞은 개수: ${correctCount} | 틀린 개수: ${wrongCount}`;
    }
</script>
